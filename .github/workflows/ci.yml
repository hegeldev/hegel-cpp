name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-tools
        with:
          tools: just uv

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18

      - name: Install zizmor
        run: pip install zizmor==1.23.1
      - name: Run zizmor
        run: zizmor --format plain .github/

      - name: Check lint
        run: just check-lint

  build-and-test:
    name: ${{ matrix.compiler }} ${{ matrix.stdlib && format('(with {0})', matrix.stdlib) || '' }} ${{ matrix.extra_label || '' }}
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++-13
            cc: gcc-13
            cxx: g++-13

          - compiler: g++-11
            cc: gcc-11
            cxx: g++-11
            packages: g++-11

          - compiler: clang++-18
            cc: clang-18
            cxx: clang++-18
            packages: clang-18

          - compiler: clang++-18
            cc: clang-18
            cxx: clang++-18
            stdlib: libc++
            packages: clang-18 libc++-18-dev libc++abi-18-dev
            cmake_flags: -DCMAKE_CXX_FLAGS="-stdlib=libc++"

          - compiler: macos
            cc: cc
            cxx: c++
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install compiler
        if: matrix.packages
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y $PACKAGES

      - uses: ./.github/actions/install-tools
        with:
          tools: just

      - name: Run tests
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CMAKE_FLAGS: ${{ matrix.cmake_flags }}
        run: just check-tests

  consumer:
    name: consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-tools
        with:
          tools: just

      - name: Run consumer tests
        run: just check-consumer-all

  cxx17:
    name: cxx17
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-tools
        with:
          tools: just

      - name: Build and run the C++17 consumer (HEGEL_REFLECTION=OFF)
        run: just check-cxx17

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install clang + llvm
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18

      - uses: ./.github/actions/install-tools
        with:
          tools: just uv

      - name: Enforce coverage floor
        env:
          CC: clang-18
          CXX: clang++-18
        run: just check-coverage

  nix:
    name: nix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: lint
        run: nix run nixpkgs#nixfmt -- --check nix/flake.nix
      - name: test
        working-directory: tests/nix
        run: |
          nix-build . 2>&1 | tee build.log
          result/bin/nix_test >> build.log
          grep "test_nix_integration_canary" build.log
          grep "All nix integration tests passed!" build.log

  docs:
    name: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-tools
        with:
          tools: just doxygen

      - name: Check docs
        run: just check-docs

  release:
    name: release
    if: github.event_name == 'push' && github.repository == 'hegeldev/hegel-cpp'
    needs: [lint, build-and-test, consumer, cxx17, coverage, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check for RELEASE.md
        id: check
        run: |
          if [ ! -f RELEASE.md ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate app token
        if: steps.check.outputs.skip != 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token
        with:
          app-id: ${{ vars.HEGEL_RELEASE_APP_ID }}
          private-key: ${{ secrets.HEGEL_RELEASE_APP_PRIVATE_KEY }}
          repositories: hegel-cpp, website

      - name: Re-checkout with app token # zizmor: ignore[artipacked]
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-tags: true

      - name: Release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEGEL_RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: python .github/scripts/release.py release

      - name: Emit version
        if: steps.check.outputs.skip != 'true'
        id: version
        run: |
          VERSION=$(sed -n 's/.*project(hegel-cpp VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push to main or open PR
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python .github/scripts/release.py push-or-pr

  pr-docs:
    name: pr-docs
    needs: [release]
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token
        with:
          app-id: ${{ vars.HEGEL_RELEASE_APP_ID }}
          private-key: ${{ secrets.HEGEL_RELEASE_APP_PRIVATE_KEY }}
          repositories: hegel-cpp, website

      - name: Checkout hegel-cpp at release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Checkout website
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 # zizmor: ignore[artipacked]
        with:
          repository: hegeldev/website
          token: ${{ steps.app-token.outputs.token }}
          path: website

      - uses: ./.github/actions/install-tools
        with:
          tools: just doxygen

      - name: Build docs
        run: just check-docs

      - name: PR docs to website repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEGEL_RELEASE_APP_ID: ${{ vars.HEGEL_RELEASE_APP_ID }}
          HEGEL_RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ needs.release.outputs.version }}
        run: python3 .github/scripts/pr_docs.py
