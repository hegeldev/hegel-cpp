name: Install tools
inputs:
  tools:
    required: true
runs:
  using: composite
  steps:
    - id: parse
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        for tool in $TOOLS; do
          case "$tool" in
            just|uv|doxygen) echo "$tool=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown tool: $tool"; exit 1 ;;
          esac
        done
      shell: bash
    - if: steps.parse.outputs.just == 'true' && runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y just
      shell: bash
    - if: steps.parse.outputs.just == 'true' && runner.os == 'macOS'
      run: brew install just
      shell: bash
    - if: steps.parse.outputs.uv == 'true'
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
    - if: steps.parse.outputs.doxygen == 'true'
      # Ubuntu's packaged doxygen is 1.9.8, which has a parallel-dot race
      # that spuriously reports "problems opening map file" and trips
      # WARN_AS_ERROR. Fixed in 1.10+; we pin the upstream Linux binary.
      env:
        DOXYGEN_VERSION: 1.15.0
        DOXYGEN_SHA256: 0ec2e5b2c3cd82b7106d19cb42d8466450730b8cb7a9e85af712be38bf4523a1
      run: |
        sudo apt-get update && sudo apt-get install -y graphviz
        curl -fsSL "https://www.doxygen.nl/files/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" -o /tmp/doxygen.tar.gz
        echo "${DOXYGEN_SHA256}  /tmp/doxygen.tar.gz" | sha256sum -c -
        sudo tar -xzf /tmp/doxygen.tar.gz -C /opt
        sudo ln -sf "/opt/doxygen-${DOXYGEN_VERSION}/bin/doxygen" /usr/local/bin/doxygen
      shell: bash
